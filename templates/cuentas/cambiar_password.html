{% extends 'cuentas/base_cuenta.html' %}
{% block title %}Cambiar contraseña · Franchesco{% endblock %}
{% block cuenta_contenido %}
<h1 class="titulo-seccion mb-4" data-reveal>Cambiar contraseña</h1>
<form method="post" novalidate style="max-width:480px" data-reveal>
  {% csrf_token %}
  {% include 'partials/campos.html' with columna_unica=True %}
  <button class="btn btn-negro px-4 mt-4">Actualizar contraseña</button>
</form>
{% endblock %}
