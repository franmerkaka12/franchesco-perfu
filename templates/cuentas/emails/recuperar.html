<!doctype html>
<html lang="es">
<body style="margin:0;padding:0;background:#f4f1ec;font-family:Arial,Helvetica,sans-serif;color:#111">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ec;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden">
        <tr><td style="background:#111;padding:22px;text-align:center;color:#fff;font-size:22px;letter-spacing:6px;font-weight:bold">FRANCHESCO</td></tr>
        <tr><td style="padding:32px 28px">
          <p style="font-size:18px;font-weight:bold;margin:0 0 12px">Hola{% if user.first_name %} {{ user.first_name }}{% endif %},</p>
          <p style="font-size:15px;line-height:1.6;margin:0 0 24px">Recibimos un pedido para cambiar la contraseña de tu cuenta. Tocá el botón para crear una nueva:</p>
          <p style="text-align:center;margin:0 0 24px">
            <a href="{{ protocol }}://{{ domain }}{% url 'cuentas:recuperar_confirmar' uidb64=uid token=token %}" style="display:inline-block;background:#111;color:#fff;text-decoration:none;padding:14px 28px;border-radius:8px;font-weight:bold;font-size:15px">Crear contraseña nueva</a>
          </p>
          <p style="font-size:13px;color:#777;line-height:1.6;margin:0">Si no fuiste vos, ignorá este mail: tu contraseña no va a cambiar.</p>
        </td></tr>
        <tr><td style="padding:16px;text-align:center;font-size:12px;color:#999;border-top:1px solid #eee">Franchesco · Perfumería</td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
