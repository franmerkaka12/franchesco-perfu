{# Frasco ilustrado en SVG: se usa cuando el producto no tiene imagen cargada. #}
{% with h=producto.tono id=producto.pk %}
<svg class="frasco" viewBox="0 0 200 260" role="img" aria-label="{{ producto.marca }} {{ producto.nombre }}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="liq{{ id }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl({{ h }},55%,68%)"/>
      <stop offset="1" stop-color="hsl({{ h }},60%,30%)"/>
    </linearGradient>
    <linearGradient id="tapa{{ id }}" x1="0" x2="1">
      <stop offset="0" stop-color="#1c1c1c"/><stop offset=".45" stop-color="#5d5d5d"/><stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="oro{{ id }}" x1="0" x2="1">
      <stop offset="0" stop-color="#8a6a3b"/><stop offset=".5" stop-color="#e6cf9e"/><stop offset="1" stop-color="#8a6a3b"/>
    </linearGradient>
  </defs>
  <ellipse cx="100" cy="250" rx="66" ry="6" fill="rgba(0,0,0,.12)"/>
  {% if producto.forma == 0 %}
    <rect x="78" y="14" width="44" height="40" rx="5" fill="url(#tapa{{ id }})"/>
    <rect x="88" y="52" width="24" height="16" fill="url(#oro{{ id }})"/>
    <rect x="40" y="66" width="120" height="180" rx="16" fill="url(#liq{{ id }})"/>
    <rect x="40" y="66" width="120" height="180" rx="16" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5"/>
    <rect x="52" y="78" width="12" height="154" rx="6" fill="rgba(255,255,255,.3)"/>
    <rect x="62" y="138" width="76" height="46" rx="2" fill="rgba(255,255,255,.9)"/>
    <text x="100" y="158" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="9" font-weight="700" letter-spacing="1" fill="#111">{{ producto.marca|upper|truncatechars:15 }}</text>
    <text x="100" y="173" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="6.5" letter-spacing="1" fill="#555">{{ producto.get_tipo_display|upper }}</text>
  {% elif producto.forma == 1 %}
    <rect x="84" y="20" width="32" height="48" rx="14" fill="url(#oro{{ id }})"/>
    <rect x="90" y="64" width="20" height="18" fill="url(#tapa{{ id }})"/>
    <circle cx="100" cy="170" r="78" fill="url(#liq{{ id }})"/>
    <circle cx="100" cy="170" r="78" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5"/>
    <path d="M45 150 A62 62 0 0 1 90 104" stroke="rgba(255,255,255,.45)" stroke-width="9" fill="none" stroke-linecap="round"/>
    <text x="100" y="172" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#fff">{{ producto.marca|upper|truncatechars:15 }}</text>
    <text x="100" y="188" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="6.5" letter-spacing="1" fill="rgba(255,255,255,.85)">{{ producto.get_tipo_display|upper }}</text>
  {% else %}
    <rect x="82" y="8" width="36" height="52" rx="3" fill="url(#tapa{{ id }})"/>
    <rect x="90" y="58" width="20" height="12" fill="url(#oro{{ id }})"/>
    <path d="M62 70 H138 L152 246 H48 Z" fill="url(#liq{{ id }})"/>
    <path d="M62 70 H138 L152 246 H48 Z" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M70 82 L60 232" stroke="rgba(255,255,255,.32)" stroke-width="10" stroke-linecap="round"/>
    <rect x="68" y="196" width="64" height="0.8" fill="rgba(255,255,255,.8)"/>
    <text x="100" y="186" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5" fill="#fff">{{ producto.marca|upper|truncatechars:15 }}</text>
    <text x="100" y="210" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="6.5" letter-spacing="1" fill="rgba(255,255,255,.85)">{{ producto.volumen_ml }} ML</text>
  {% endif %}
</svg>
{% endwith %}
