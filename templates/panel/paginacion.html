{% load tienda_extras %}
{% if pagina.has_other_pages %}
<nav class="d-flex justify-content-between align-items-center mt-3 small">
  <span class="text-muted">Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span>
  <ul class="pagination pagination-sm mb-0">
    {% if pagina.has_previous %}<li class="page-item"><a class="page-link text-dark" href="{% url_con page=pagina.previous_page_number %}">Anterior</a></li>{% endif %}
    {% if pagina.has_next %}<li class="page-item"><a class="page-link text-dark" href="{% url_con page=pagina.next_page_number %}">Siguiente</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
